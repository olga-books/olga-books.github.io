<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет читателя</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
            transition: all 0.3s ease;
        }
        /* Стиль для режима чтения — расширяет окно на весь экран */
        .card.expanded {
            max-width: 900px;
            height: 85vh;
            display: flex;
            flex-direction: column;
        }
        h1 { color: #005bff; font-size: 22px; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        input[type="text"] {
            width: 85%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
        }
        button {
            background-color: #005bff;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 92%;
        }
        button:hover { background-color: #0045c7; }
        .result { margin-top: 20px; font-size: 15px; font-weight: bold; }
        .success { color: #2ed573; }
        .error { color: #ff4757; }
        
        /* Блок с кнопкой скачивания и просмотром */
        #book-area {
            display: none;
            flex-direction: column;
            height: 100%;
            margin-top: 15px;
        }
        .download-btn {
            display: inline-block;
            background-color: #2ed573;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-weight: bold;
            margin-bottom: 15px;
            align-self: center;
        }
        .download-btn:hover { background-color: #26af5f; }
        
        /* Контейнер для просмотра PDF */
        .pdf-viewer {
            flex-grow: 1;
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: #eee;
            min-height: 400px;
        }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <div id="auth-area">
            <h1>📚 Доступ к электронной книге</h1>
            <p>Введите номер отправления (заказа) из личного кабинета OZON для проверки доступа.</p>
            
            <input type="text" id="order-input" placeholder="Например: 12345678-0001-1">
            <button id="check-btn">Получить книгу</button>
            
            <div id="result-message" class="result"></div>
        </div>

        <!-- Зона чтения и скачивания (скрыта изначально) -->
        <div id="book-area">
            <h1 style="margin-top: 0;">📖 Ваша книга доступна</h1>
            <a href="" id="link-download" target="_blank" class="download-btn">⬇️ Скачать файл PDF</a>
            <iframe src="" id="pdf-frame" class="pdf-viewer"></iframe>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, get, update } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyADDsFRF3Dwewv8MqcbQrRMZESK3CoG5AU",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebasedatabase.app",
            projectId: "put-do-bogatstva",
            storageBucket: "put-do-bogatstva.firebasestorage.app",
            messagingSenderId: "317422748511",
            appId: "1:317422748511:web:26395f5579d8748838ecea"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const input = document.getElementById('order-input');
        const btn = document.getElementById('check-btn');
        const resultDiv = document.getElementById('result-message');
        
        const mainCard = document.getElementById('main-card');
        const authArea = document.getElementById('auth-area');
        const bookArea = document.getElementById('book-area');
        const linkDownload = document.getElementById('link-download');
        const pdfFrame = document.getElementById('pdf-frame');

        // Вставьте сюда вашу ссылку на PDF файл (например, из Яндекс.Диска или Firebase Storage)
        const REAL_PDF_URL = 'https://githubusercontent.com'; 

        btn.addEventListener('click', async () => {
            const orderNumber = input.value.trim().replace('.', '_');
            
            if (!orderNumber) {
                resultDiv.innerHTML = '<span class="error">Введите номер заказа!</span>';
                return;
            }

            resultDiv.innerHTML = 'Проверяем номер в базе...';

            try {
                const orderRef = ref(db, `allowed_orders/${orderNumber}`);
                const snapshot = await get(orderRef);

                if (snapshot.exists()) {
                    const orderData = snapshot.val();

                    if (orderData.used === true) {
                        resultDiv.innerHTML = '<span class="error">По этому номеру заказа книга уже открывалась!</span>';
                    } else {
                        // Фиксируем факт первого открытия книги
                        await update(orderRef, { used: true, activated_at: new Date().toISOString() });
                        
                        // Переключаем интерфейс в режим чтения
                        authArea.style.display = 'none';
                        bookArea.style.display = 'flex';
                        mainCard.classList.add('expanded');
                        
                        // Привязываем ссылки к кнопке скачивания и просмотрщику
                        linkDownload.href = REAL_PDF_URL;
                        pdfFrame.src = REAL_PDF_URL;
                    }
                } else {
                    resultDiv.innerHTML = '<span class="error">Номер заказа не найден. Робот проверяет базу раз в час. Попробуйте чуть позже.</span>';
                }
            } catch (error) {
                console.error(error);
                resultDiv.innerHTML = '<span class="error">Ошибка подключения.</span>';
            }
        });
    </script>
</body>
</html>
