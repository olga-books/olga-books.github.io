<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет читателя</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
            transition: all 0.3s ease;
        }
        /* Элегантно расширяем личный кабинет, когда доступ получен */
        .card.expanded {
            max-width: 900px;
            height: 85vh;
            display: flex;
            flex-direction: column;
        }
        h1 { color: #005bff; font-size: 22px; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        input[type="text"] {
            width: 85%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
        }
        button {
            background-color: #005bff;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 92%;
        }
        button:hover { background-color: #0045c7; }
        .result { margin-top: 20px; font-size: 15px; font-weight: bold; }
        .success { color: #2ed573; }
        .error { color: #ff4757; }
        
        /* Зона личного кабинета с книгой */
        #book-area {
            display: none;
            flex-direction: column;
            height: 100%;
            margin-top: 15px;
        }
        .download-btn {
            display: inline-block;
            background-color: #2ed573;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-weight: bold;
            margin-bottom: 15px;
            align-self: center;
        }
        .download-btn:hover { background-color: #26af5f; }
        
        /* Удобный адаптивный плеер для чтения PDF онлайн */
        .pdf-viewer {
            flex-grow: 1;
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: #eee;
            min-height: 450px;
        }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <!-- Экран 1: Ввод номера заказа -->
        <div id="auth-area">
            <h1>📚 Личный кабинет читателя</h1>
            <p>Введите номер отправления (заказа) из личного кабинета OZON для проверки доступа.</p>
            
            <input type="text" id="order-input" placeholder="Например: 12345678-0001-1">
            <button id="check-btn">Открыть книгу</button>
            
            <div id="result-message" class="result"></div>
        </div>

        <!-- Экран 2: Онлайн-чтение и скачивание книги -->
        <div id="book-area">
            <h1 style="margin-top: 0; font-size: 20px;">📖 Приятного чтения!</h1>
            <a href="" id="link-download" target="_blank" class="download-btn">⬇️ Скачать книгу на устройство</a>
            <iframe src="" id="pdf-frame" class="pdf-viewer" frameborder="0"></iframe>
        </div>
    </div>

    <!-- Интеграция с вашей базой данных put-do-bogatstva -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, get, update } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyADDsFRF3Dwewv8MqcbQrRMZESK3CoG5AU",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://put-do-bogatstva-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "put-do-bogatstva",
            storageBucket: "put-do-bogatstva.firebasestorage.app",
            messagingSenderId: "317422748511",
            appId: "1:317422748511:web:26395f5579d8748838ecea"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const input = document.getElementById('order-input');
        const btn = document.getElementById('check-btn');
        const resultDiv = document.getElementById('result-message');
        
        const mainCard = document.getElementById('main-card');
        const authArea = document.getElementById('auth-area');
        const bookArea = document.getElementById('book-area');
        const linkDownload = document.getElementById('link-download');
        const pdfFrame = document.getElementById('pdf-frame');

        btn.addEventListener('click', async () => {
            // Очищаем введенный номер и заменяем дефисы/точки на подчеркивания под формат Firebase
            let rawOrder = input.value.trim();
            const orderNumber = rawOrder.replace(/\./g, '_').replace(/-/g, '_');
            
            if (!rawOrder) {
                resultDiv.innerHTML = '<span class="error">Пожалуйста, введите номер заказа!</span>';
                return;
            }

            resultDiv.innerHTML = 'Авторизация читателя... Проверяем базу OZON.';

            try {
                // 1. Стучимся в Firebase и ищем этот номер заказа
                const orderRef = ref(db, `allowed_orders/${orderNumber}`);
                const snapshot = await get(orderRef);

                if (snapshot.exists()) {
                    const orderData = snapshot.val();

                    // 2. Защита от пиратства: проверяем, не использован ли он
                    if (orderData.used === true) {
                        resultDiv.innerHTML = '<span class="error">По этому номеру заказа книга уже была открыта! Доступ заблокирован.</span>';
                    } else {
                        // 3. Если заказ легальный, тайно запрашиваем секретный адрес книги из Firebase
                        const settingsRef = ref(db, 'book_settings/url');
                        const urlSnapshot = await get(settingsRef);
                        
                        if (!urlSnapshot.exists()) {
                            resultDiv.innerHTML = '<span class="error">Ошибка: Ссылка на книгу не настроена в Firebase (узел book_settings/url)!</span>';
                            return;
                        }
                        
                        const secretBookUrl = urlSnapshot.val();

                        // 4. Блокируем этот номер заказа для повторных вводов
                        await update(orderRef, { used: true, activated_at: new Date().toISOString() });
                        
                        // 5. Переключаем кабинет в режим чтения
                        authArea.style.display = 'none';
                        bookArea.style.display = 'flex';
                        mainCard.classList.add('expanded');
                        
                        // Прямая ссылка на скачивание
                        linkDownload.href = secretBookUrl;
                        
                        // Безопасное встраивание через Google Docs Viewer для чтения прямо на сайте
                        pdfFrame.src = `https://google.com{encodeURIComponent(secretBookUrl)}&embedded=true`;
                    }
                } else {
                    resultDiv.innerHTML = '<span class="error">Номер заказа не найден. Робот синхронизирует новые заказы раз в час. Попробуйте ввести через 15-30 минут после получения посылки.</span>';
                }
            } catch (error) {
                console.error(error);
                resultDiv.innerHTML = '<span class="error">Ошибка соединения с сервером авторизации. Проверьте подключение к интернету.</span>';
            }
        });
    </script>
</body>
</html>
