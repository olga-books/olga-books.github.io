name: Ozon to Firebase Sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Run Sync Script
        env:
          OZON_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          if [ -z "$OZON_ID" ] || [ -z "$OZON_KEY" ]; then
            echo "Ошибка: Ключи OZON_CLIENT_ID или OZON_API_KEY не найдены в Secrets!"
            exit 1
          fi

          OZON_RAW=$(curl -s -X POST "https://ozon.ru" \
            -H "Client-Id: $OZON_ID" \
            -H "Api-Key: $OZON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"dir": "DESC", "filter": { "since": "2026-01-01T00:00:00Z" }, "limit": 50}')

          if echo "$OZON_RAW" | jq -e '.error' >/dev/null; then
            echo "Ошибка API OZON:"
            echo "$OZON_RAW" | jq '.error'
            exit 1
          fi

          ORDERS=$(echo "$OZON_RAW" | jq -r '.result[] | select(.status == "posting_delivered" or .status == "posting_received") | .posting_number' 2>/dev/null || true)

          if [ -z "$ORDERS" ] || [ "$ORDERS" = "null" ]; then
            echo "Новых доставленных заказов в кабинете OZON на данный момент нет."
            exit 0
          fi

          for ORDER in $ORDERS
          do
            SAFE_ORDER=$(echo "$ORDER" | tr '.' '_')
            echo "Обработка заказа: $SAFE_ORDER"
            
            EXISTING=$(curl -s "https://firebasedatabase.app")
            
            if [ "$EXISTING" = "null" ]; then
              curl -s -X PUT "https://firebasedatabase.app" \
                -H "Content-Type: application/json" \
                -d '{"used": false, "added_at": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > /dev/null
              echo "Заказ $SAFE_ORDER успешно синхронизирован с Firebase!"
            else
              echo "Заказ $SAFE_ORDER уже есть в базе. Пропускаем."
            fi
          done
